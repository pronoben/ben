<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bureau Serein — Bien s'équiper pour le télétravail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F3EC;
    --cream-2:#EFEADD;
    --ink:#23261F;
    --ink-soft:#4B4F42;
    --green:#3F5D4E;
    --green-deep:#2C4438;
    --amber:#C08A4E;
    --line:#DCD5C4;
    --card:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#1B1D17;
      --cream-2:#23261F;
      --ink:#EDEAE0;
      --ink-soft:#B9B6A9;
      --green:#8CB39E;
      --green-deep:#A9CBB8;
      --amber:#D9A768;
      --line:#3A3D33;
      --card:#23261F;
    }
  }
  :root[data-theme="dark"]{
    --cream:#1B1D17;
    --cream-2:#23261F;
    --ink:#EDEAE0;
    --ink-soft:#B9B6A9;
    --green:#8CB39E;
    --green-deep:#A9CBB8;
    --amber:#D9A768;
    --line:#3A3D33;
    --card:#23261F;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Fraunces',Georgia,serif;
    font-weight:500;
    color:var(--ink);
    margin:0;
    letter-spacing:-0.01em;
  }
  a{color:inherit;}
  img{max-width:100%;}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px;}

  header.top{
    padding:22px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .logo{
    font-family:'Fraunces',serif;
    font-size:1.15rem;
    font-weight:600;
  }
  .logo span{color:var(--green);}
  nav a{
    text-decoration:none;
    font-size:0.92rem;
    color:var(--ink-soft);
    margin-left:22px;
  }
  nav a:hover{color:var(--ink);}

  .hero{
    padding:88px 24px 72px;
  }
  .hero-inner{
    max-width:960px;
    margin:0 auto;
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    gap:56px;
    align-items:center;
  }
  .hero h1{
    font-size:clamp(2.1rem,4.2vw,3.1rem);
    line-height:1.14;
    max-width:11ch;
  }
  .hero p.lede{
    margin-top:22px;
    font-size:1.08rem;
    color:var(--ink-soft);
    max-width:46ch;
  }
  .hero-illustration{
    width:100%;
    height:auto;
  }

  .intent-bar{
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:22px 24px;
    background:var(--cream-2);
  }
  .intent-bar .wrap{
    display:flex;
    gap:36px;
    flex-wrap:wrap;
    font-size:0.94rem;
